{{ define "main" }}
    <div class="content">
        <main class="posts">
            <h1>{{ .Title }}</h1>

            {{ if .Content }}
                <div class="content">{{ .Content }}</div>
            {{ end }}

            {{ $pages := .Data.Pages.ByDate.Reverse }}
            {{ partial "tag-filter.html" (dict "pages" $pages "selected" (slice (lower .Title))) }}
        </main>
    </div>
{{ end }}
