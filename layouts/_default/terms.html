{{ define "main" }}
    <div class="content">
        <main class="posts">
            <h1>Search</h1>

            {{ if .Content }}
                <div class="content">{{ .Content }}</div>
            {{ end }}

            {{ $pages := where .Site.RegularPages "Params.tags" "!=" nil }}
            {{ partial "tag-filter.html" (dict "pages" $pages "selected" slice) }}
        </main>
    </div>
{{ end }}
